version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hospital
    ports:
      - "3306:3306"

  hospital-backend:
    build: ../Back/hospital-platform/hospital-web
    depends_on: [mysql]
    ports:
      - "8080:8080"

  hospital-ai:
    build: .
    depends_on: [mysql]
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: hospital